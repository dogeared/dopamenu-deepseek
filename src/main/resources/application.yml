spring:
  application:
    name: dopamenu
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/dopamenu}
    username: ${DB_USER:dopamenu}
    password: ${DB_PASSWORD:dopamenu}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  keycloak:
    # Browser-facing Keycloak URL (authorization endpoint + token issuer).
    public-url: ${KEYCLOAK_PUBLIC_URL:http://localhost:8180}
    # Back-channel URL used for token exchange and JWKS. Can differ in Docker.
    internal-url: ${KEYCLOAK_INTERNAL_URL:http://localhost:8180}
    realm: ${KEYCLOAK_REALM:dopamenu}
    client-id: ${KEYCLOAK_CLIENT_ID:dopamenu-app}
    client-secret: ${KEYCLOAK_CLIENT_SECRET:dopamenu-secret}

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

vaadin:
  # Set to true locally if you want the browser to open automatically.
  launch-browser: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.example.dopamenu: INFO
