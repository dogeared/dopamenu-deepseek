name: dopamenu

services:
  db:
    image: postgres:17-alpine
    container_name: dopamenu-db
    environment:
      POSTGRES_DB: dopamenu
      POSTGRES_USER: dopamenu
      POSTGRES_PASSWORD: dopamenu
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - dopamenu-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dopamenu -d dopamenu"]
      interval: 5s
      timeout: 3s
      retries: 12

  app:
    build: .
    container_name: dopamenu-app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/dopamenu
      DB_USER: dopamenu
      DB_PASSWORD: dopamenu
      # The browser uses the public URL; token exchange and JWKS use the
      # internal URL, which reaches a Keycloak running on the host.
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8180}
      KEYCLOAK_INTERNAL_URL: ${KEYCLOAK_INTERNAL_URL:-http://host.docker.internal:8180}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-dopamenu}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-dopamenu-app}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-dopamenu-secret}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 4s
      start_period: 40s
      retries: 5

volumes:
  dopamenu-pg:
