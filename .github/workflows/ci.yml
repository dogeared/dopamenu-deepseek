name: CI

on:
  push:
    branches:
      - "**"
      - "!badges"
  pull_request:
    types:
      - closed

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    if: github.event_name == 'push' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        run: mvn -B verify

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco

      - name: Generate coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cicirello/jacoco-badge-generator@v2
        with:
          jacoco-csv-file: target/site/jacoco/jacoco.csv
          generate-branches-badge: true

      - name: Publish coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .github/badges
          publish_branch: badges
          commit_message: "Update coverage badge"

  tag:
    name: Tag release
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out merge commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Determine version
        id: version
        run: |
          set -euo pipefail

          # Prefer an explicit release version in the merge commit message
          # (e.g. "release 0.0.1" or "release: v0.0.2").
          MERGE_MESSAGE=$(git log -1 --format=%B HEAD)

          VERSION=$(printf '%s\n' "$MERGE_MESSAGE" \
            | grep -oiE 'release[[:space:]:-]*v?[0-9]+\.[0-9]+\.[0-9]+' \
            | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' \
            | head -n 1 || true)

          # Otherwise use the version declared in pom.xml at this commit.
          if [ -z "${VERSION:-}" ]; then
            VERSION=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          fi

          VERSION=${VERSION%-SNAPSHOT}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

      - name: Create and push tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, nothing to do."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

  # Only a merge to main publishes. Branch pushes run the tests but can never
  # produce a :latest image, so branch code can never reach the NAS.
  publish:
    name: Publish image
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Determine version
        id: version
        run: |
          set -euo pipefail
          VERSION=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          VERSION=${VERSION%-SNAPSHOT}
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/dogeared/dopamenu-deepseek
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=sha-
            type=raw,value=${{ steps.version.outputs.value }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # This is the only deploy path: the agent is reachable only through the NAS's
  # Cloudflare tunnel and authorises each call with an HMAC over
  # "<timestamp>.<body>". Missing secrets are a setup error, so fail loudly
  # rather than leave the NAS on the previous image.
  deploy:
    name: Deploy to NAS
    runs-on: ubuntu-latest
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Ask the NAS to deploy
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
          PROJECT: dopamenu
        run: |
          if [ -z "$DEPLOY_WEBHOOK_URL" ] || [ -z "$DEPLOY_WEBHOOK_SECRET" ]; then
            echo "::error::DEPLOY_WEBHOOK_URL / DEPLOY_WEBHOOK_SECRET are not set"
            exit 1
          fi
          BODY=$(printf '{"project":"%s","sha":"%s"}' "$PROJECT" "$GITHUB_SHA")
          TS=$(date +%s)
          SIG=$(python3 -c 'import hashlib,hmac,sys; print(hmac.new(sys.argv[1].encode(), sys.argv[2].encode()+b"."+sys.argv[3].encode(), hashlib.sha256).hexdigest())' "$DEPLOY_WEBHOOK_SECRET" "$TS" "$BODY")
          for attempt in 1 2 3; do
            code=$(curl -sS -o /tmp/deploy.json -w '%{http_code}' -X POST "$DEPLOY_WEBHOOK_URL" \
              -H 'Content-Type: application/json' \
              -H "X-Deploy-Timestamp: $TS" \
              -H "X-Deploy-Signature: sha256=$SIG" \
              --data "$BODY" || echo 000)
            if [ "$code" = "200" ]; then
              cat /tmp/deploy.json
              exit 0
            fi
            echo "attempt $attempt failed (HTTP $code)"
            cat /tmp/deploy.json 2>/dev/null || true
            sleep 10
          done
          exit 1
